<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Booking | PawPaw Pet Care</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/admin.css">
</head>
<body>
  <header class="admin-topbar">
    <div class="container-fluid admin-shell d-flex align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-3">
        <img class="admin-logo" src="../assets/img/logo.png" alt="Logo PawPaw Pet Care">
        <div>
          <p class="admin-kicker mb-0">PAWPAW PET CARE</p>
          <h1 class="admin-title mb-0">Admin Booking</h1>
        </div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm fw-semibold" href="admin_shop.html">Admin Shop</a>
        <a class="btn btn-light btn-sm fw-semibold" href="health-services.html">← Layanan Kesehatan</a>
      </div>
    </div>
  </header>

  <main class="container-fluid admin-shell py-4 py-md-5">
    <section class="card admin-card border-0">
      <div class="card-header admin-card-header booking-header d-flex flex-wrap justify-content-between align-items-center gap-2 py-3">
        <div>
          <h2 class="h5 mb-1 fw-bold">Daftar Permintaan Booking Kesehatan</h2>
          <p class="mb-0 small opacity-75">Data booking dari halaman layanan kesehatan.</p>
        </div>
        <span class="badge rounded-pill text-bg-light">Health Booking</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 admin-table">
            <thead>
              <tr>
                <th class="text-center">No</th>
                <th>Nama Hewan</th>
                <th>Jenis Layanan</th>
                <th>Tanggal &amp; Waktu</th>
                <th class="text-center">Status</th>
                <th class="text-center">Detail / Aksi</th>
              </tr>
            </thead>
            <tbody id="tabelAdmin"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="modalDetail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header admin-modal-header booking-header">
          <h5 class="modal-title fw-bold">Detail Permintaan Booking</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/health-services-admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Permintaan Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="card shadow-sm border-0">
      
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
        <h5 class="mb-0 fw-bold">Daftar Permintaan Booking</h5>
        <span class="badge bg-light text-primary fs-6">Admin Panel</span>
      </div>

      <div class="card-body p-4">
        <div class="table-responsive">
          <table class="table table-hover align-middle border">
            <thead class="table-dark">
              <tr>
                <th class="text-center">No</th>
                <th>Nama Hewan</th>
                <th>Jenis Layanan</th>
                <th>Tanggal & Waktu</th>
                <th class="text-center">Status</th>
                <th class="text-center">Detail / Aksi</th>
              </tr>
            </thead>
            <tbody id="tabelAdmin">
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Pop-up Modal Detail Bootstrap -->
  <div class="modal fade" id="modalDetail" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">Detail Permintaan Booking</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modalBody">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Library JavaScript Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- File Logika JavaScript Khusus Admin -->
  <script src="../JS/health-services-admin.js"></script>
</body>
</html>

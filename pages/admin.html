<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Booking | PawPaw Pet Care</title>
  <!-- FontAwesome untuk Ikon Edit & Hapus -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/admin.css">
</head>
<body>

  <!-- TOPBAR ADMIN -->
  <header class="admin-topbar">
    <div class="container-fluid admin-shell d-flex align-items-center justify-content-between gap-3">
      <div class="d-flex align-items-center gap-3">
        <img class="admin-logo" src="../assets/img/logo.png" alt="Logo PawPaw">
        <div>
          <p class="admin-kicker mb-0">PAWPAW PET CARE</p>
          <h1 class="admin-title mb-0">Admin Booking</h1>
        </div>
      </div>
      <a class="btn btn-light btn-sm fw-semibold" href="health-services.html">← Layanan Kesehatan</a>
    </div>
  </header>

  <main class="container-fluid admin-shell py-4 py-md-5">

    <!-- 1. TAMPILAN TABEL DAFTAR BOOKING -->
    <section class="card admin-card border-0" id="halamanTabelBooking">
      <div class="card-header admin-card-header booking-header d-flex justify-content-between align-items-center py-3">
        <div>
          <h2 class="h5 mb-1 fw-bold">Daftar Permintaan Booking Kesehatan</h2>
          <p class="mb-0 small opacity-75">Kelola data permintaan periksa &amp; vaksinasi dari pelanggan.</p>
        </div>
        <span class="badge rounded-pill text-bg-light">Health Booking</span>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 admin-table">
            <thead>
              <tr>
                <th class="text-center">No</th>
                <th>Nama Hewan</th>
                <th>Jenis Layanan</th>
                <th>Tanggal &amp; Waktu</th>
                <th class="text-center">Status</th>
                <th class="text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tabelBodyBooking">
              <!-- Data booking akan muncul di sini via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 2. TAMPILAN HALAMAN DETAIL BOOKING (Sembunyi secara default) -->
    <section class="card admin-card border-0 d-none" id="halamanDetailBooking">
      <div class="card-header admin-card-header booking-header d-flex align-items-center gap-3 py-3">
        <button class="btn btn-light btn-sm fw-bold" id="tombolKembali">
          <i class="fa-solid fa-arrow-left"></i> Kembali ke Tabel
        </button>
        <h2 class="h5 mb-0 fw-bold">Detail Permintaan Booking</h2>
      </div>
      <div class="card-body p-4" id="kontenDetailBooking">
        <!-- Detail booking dirender via JS -->
      </div>
    </section>

  </main>

  <!-- MODAL INPUT ALASAN PENOLAKAN -->
  <div class="modal fade" id="modalAlasanTolak" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title fw-bold">Alasan Penolakan Booking</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label font-semibold">Tuliskan alasan kenapa permintaan ini ditolak:</label>
          <textarea id="inputAlasan" class="form-control" rows="4" placeholder="Contoh: Jadwal dokter pada jam tersebut sudah penuh."></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-danger" id="tombolSimpanTolak">Kirim Penolakan</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/admin.js"></script>
</body>
</html>

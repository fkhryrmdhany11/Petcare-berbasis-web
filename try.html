<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Testimoni</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    background: #fff;
    padding: 40px;
  }

  .testi-title {
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 20px;
  }

  .testi-list {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
  }

  .testi-card {
    background: #fdf6d8;
    border-radius: 18px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 230px;
    box-shadow: 0 3px 6px rgba(0,0,0,.08);
  }

  .testi-top {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .testi-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px #e0c98f;
  }

  .testi-stars {
    color: #f5b301;
    font-size: 1rem;
    letter-spacing: 2px;
  }

  .testi-body {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .95rem;
  }

  .testi-name {
    font-weight: 800;
    white-space: nowrap;
  }

  .testi-divider {
    width: 1px;
    align-self: stretch;
    background: #cfc79a;
  }

  .testi-text {
    line-height: 1.25;
    color: #222;
  }
</style>
</head>
<body>

  <h2 class="testi-title">Apa Kata Mereka?</h2>

  <div class="testi-list">

    <div class="testi-card">
      <div class="testi-top">
        <img class="testi-avatar" src="https://i.pravatar.cc/100?img=12" alt="Foto pengguna">
        <span class="testi-stars">★★★★★</span>
      </div>
      <div class="testi-body">
        <span class="testi-name">JEYU</span>
        <span class="testi-divider"></span>
        <span class="testi-text">Banyak pilihan hewan adopsi!</span>
      </div>
    </div>

    <div class="testi-card">
      <div class="testi-top">
        <img class="testi-avatar" src="https://i.pravatar.cc/100?img=32" alt="Foto pengguna">
        <span class="testi-stars">★★★★★</span>
      </div>
      <div class="testi-body">
        <span class="testi-name">JEYU</span>
        <span class="testi-divider"></span>
        <span class="testi-text">Banyak pilihan hewan adopsi!</span>
      </div>
    </div>

    <div class="testi-card">
      <div class="testi-top">
        <img class="testi-avatar" src="https://i.pravatar.cc/100?img=45" alt="Foto pengguna">
        <span class="testi-stars">★★★★★</span>
      </div>
      <div class="testi-body">
        <span class="testi-name">JEYU</span>
        <span class="testi-divider"></span>
        <span class="testi-text">Banyak pilihan hewan adopsi!</span>
      </div>
    </div>

  </div>

</body>
</html>

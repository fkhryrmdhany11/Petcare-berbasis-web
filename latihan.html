<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <title>Menu Makanan</title>
    <link rel="stylesheet" href="style2.css" />
</head>
<body>
    <main class="daftar-produk">
        
      
        <article class="kartu-produk">
            <img src="nasigoreng.jpeg" alt="Foto Nasi Goreng" />
            <h2>Nasi Goreng</h2>
            <p>Nasi goreng terenak.</p>
            <div class="aksi">
                <span class="harga">Rp 15.000</span>
                <button type="button">Beli</button>
            </div>
        </article>
        
    
        <article class="kartu-produk">
            <img src="migoreng.jpeg" alt="Foto Mie Goreng" />
            <h2>Mie Goreng</h2>
            <p>Mie goreng lezat dengan bumbu gurih dan potongan ayam.</p>
            <div class="aksi">
                <span class="harga">Rp 15.000</span>
                <button type="button">Beli</button>
            </div>
        </article>

      
        <article class="kartu-produk">
            <img src="nasiuduk.jpeg" alt="Foto Nasi Uduk" />
            <h2>Nasi Uduk Komplit</h2>
            <p>Nasi uduk nikmat dengan tambahan bihun, orek tempe, dan kerupuk.</p>
            <div class="aksi">
                <span class="harga">Rp 12.000</span>
                <button type="button">Beli</button>
            </div>
        </article>

    </main>
</body>
</html>

<!doctype html>
<html lang="id">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link rel="stylesheet" href="CSS/main.css" />
  <link rel="stylesheet" href="CSS/admin-sidebar.css" />
  <link rel="stylesheet" href="CSS/dashboard-admin.css" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com/"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,1000&display=swap"
    rel="stylesheet"
  />

  <title>Dashboard Admin - PawPaw Pet Care</title>

</head>

<body>

  <div class="sb-layout">

    <div class="sb-overlay" id="sbOverlay"></div>

    <aside class="sb-sidebar" id="sbSidebar">

      <div class="sb-brand">
        <img src="assets/img/logo.png" alt="Logo PawPaw Pet Care">
        <span>PawPaw Admin</span>
      </div>

      <nav class="sb-nav">
        <a href="admin-dashboard.html" class="active">📊 Dashboard</a>
        <a href="pages/admin_shop.html">🛍️ Pesanan Toko</a>
        <a href="pages/admin-adoption.html">🐶 Adopsi</a>
        <a href="pages/admin.html">📅 Booking</a>
      </nav>

      <div class="sb-footer">
        <a href="pages/shop.html">← Kembali ke Toko</a>
        <a href="pages/login.html">↩ Keluar</a>
      </div>

    </aside>


    <main class="admin-main">

      <header class="admin-topbar">

        <button
          type="button"
          class="sb-menu-button"
          id="sbMenuButton"
          aria-label="Buka menu"
        >
          ☰
        </button>

        <div>

          <h1>Halo, Admin! 👋</h1>

          <p id="todayLabel"></p>

        </div>

      </header>


      <!-- 1. Kartu statistik -->
      <section class="stat-grid" id="statGrid"></section>


      <div class="dashboard-grid">

        <!-- 2. Perlu tindakan -->
        <section class="panel">

          <div class="panel-header">
            <h2>Perlu Tindakan</h2>
            <span class="panel-count" id="actionCount">0</span>
          </div>

          <ul class="action-list" id="actionList"></ul>

        </section>


        <!-- 3. Aktivitas terbaru -->
        <section class="panel">

          <div class="panel-header">
            <h2>Aktivitas Terbaru</h2>
          </div>

          <ul class="activity-list" id="activityList"></ul>

        </section>

      </div>


      <div class="dashboard-grid">

        <!-- 4a. Jadwal booking -->
        <section class="panel">

          <div class="panel-header">
            <h2>Jadwal Booking Hari Ini</h2>
            <a href="pages/admin.html" class="panel-link">Lihat semua</a>
          </div>

          <ul class="schedule-list" id="bookingList"></ul>

        </section>


        <!-- 4b. Pesanan yang harus dikirim -->
        <section class="panel">

          <div class="panel-header">
            <h2>Pesanan Dikirim Hari Ini</h2>
            <a href="pages/admin_shop.html" class="panel-link">Lihat semua</a>
          </div>

          <ul class="schedule-list" id="shipmentList"></ul>

        </section>

      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="JS/admin-sidebar.js"></script>
  <script src="JS/admin-dashboard.js"></script>

</body>

</html>

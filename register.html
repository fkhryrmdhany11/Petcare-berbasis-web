<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar | PawPaw Pet Care</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="CSS/auth.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="assets/img/logo.png" alt="Logo PawPaw Pet Care" />
      <div>
        <h1>Buat Akun PawPaw</h1>
        <p>Username akun akan dipakai otomatis saat checkout.</p>
      </div>
    </div>

    <div id="auth-message" class="alert alert-danger py-2" hidden></div>

    <form id="register-form">
      <div class="mb-3">
        <label class="form-label" for="register-name">Nama</label>
        <input class="form-control" id="register-name" autocomplete="name" maxlength="80" required />
      </div>
      <div class="mb-3">
        <label class="form-label" for="register-username">Username</label>
        <input class="form-control" id="register-username" autocomplete="username" maxlength="40" pattern="[A-Za-z0-9._-]{3,40}" required />
        <div class="form-text">Minimal 3 karakter. Gunakan huruf, angka, titik, garis bawah, atau tanda minus.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="register-password">Password</label>
        <input class="form-control" id="register-password" type="password" autocomplete="new-password" minlength="4" required />
      </div>
      <div class="mb-4">
        <label class="form-label" for="register-confirm">Konfirmasi Password</label>
        <input class="form-control" id="register-confirm" type="password" autocomplete="new-password" minlength="4" required />
      </div>
      <button class="btn auth-primary w-100 py-2" type="submit">Daftar</button>
    </form>

    <p class="text-center small text-secondary mt-4 mb-0">
      Sudah punya akun? <a href="login.html">Login</a>
    </p>
  </main>

  <script src="JS/account.js"></script>
  <script src="JS/auth.js"></script>
</body>
</html>

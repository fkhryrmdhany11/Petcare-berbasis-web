<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | PawPaw Pet Care</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="CSS/auth.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="auth-brand">
      <img src="assets/img/logo.png" alt="Logo PawPaw Pet Care" />
      <div>
        <h1>Masuk ke PawPaw</h1>
        <p>Gunakan akun customer untuk melanjutkan.</p>
      </div>
    </div>

    <div id="auth-message" class="alert alert-danger py-2" hidden></div>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label" for="login-username">Username</label>
        <input class="form-control" id="login-username" autocomplete="username" maxlength="40" required />
      </div>
      <div class="mb-3">
        <label class="form-label" for="login-password">Password</label>
        <input class="form-control" id="login-password" type="password" autocomplete="current-password" minlength="4" required />
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="remember-account" />
        <label class="form-check-label" for="remember-account">Tetap masuk di browser ini</label>
      </div>
      <button class="btn auth-primary w-100 py-2" type="submit">Login</button>
    </form>

    <p class="text-center small text-secondary mt-4 mb-0">
      Belum punya akun? <a href="register.html">Daftar di sini</a>
    </p>
  </main>

  <script src="JS/account.js"></script>
  <script src="JS/auth.js"></script>
</body>
</html>

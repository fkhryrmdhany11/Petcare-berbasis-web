<!doctype html>
<html lang="id">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <link
    rel="stylesheet"
    href="CSS/main.css"
  />

  <link
    rel="stylesheet"
    href="CSS/login.css"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com/"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,1000&display=swap"
    rel="stylesheet"
  />

  <title>Masuk / Daftar - PawPaw Pet Care</title>

</head>

<body>

  <div class="auth-page">

    <a href="../index.html" class="auth-home-link">
      🐾 PawPaw Pet Care
    </a>

    <div class="auth-wrapper">

      <div class="mascot" id="mascot">

        <div class="mascot-ear left"></div>
        <div class="mascot-ear right"></div>

        <div class="mascot-face">

          <div class="mascot-eye left">
            <div class="mascot-pupil" id="pupilLeft"></div>
          </div>

          <div class="mascot-eye right">
            <div class="mascot-pupil" id="pupilRight"></div>
          </div>

          <div class="mascot-nose"></div>

        </div>

      </div>

      <div class="auth-flip-container" id="authFlip">

        <div class="auth-flip-inner">

          <!-- LOGIN SIDE -->
          <div class="auth-card auth-front">

            <h1>Selamat Datang Kembali!</h1>
            <p class="auth-subtitle">Masuk untuk lanjut rawat si bulu 🐶</p>

            <div id="loginMessage" class="auth-message"></div>

            <form id="loginForm" novalidate>

              <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="nama@email.com" required>
              </div>

              <div class="form-group">
                <label for="loginPassword">Kata Sandi</label>
                <input type="password" id="loginPassword" placeholder="Masukkan kata sandi" required>
              </div>

              <div class="auth-row">
                <label class="auth-checkbox">
                  <input type="checkbox" id="rememberMe">
                  <span>Ingat saya</span>
                </label>

                <a href="#" class="auth-link-small">Lupa kata sandi?</a>
              </div>

              <button type="submit" class="auth-submit-button">
                Masuk
              </button>

            </form>

            <p class="auth-switch">
              Belum punya akun?
              <button type="button" class="auth-switch-button" data-target="signup">
                Daftar di sini
              </button>
            </p>

          </div>

          <!-- SIGNUP SIDE -->
          <div class="auth-card auth-back">

            <h1>Gabung Yuk!</h1>
            <p class="auth-subtitle">Daftar buat mulai adopsi &amp; rawat hewan 🐰</p>

            <div id="signupMessage" class="auth-message"></div>

            <form id="signupForm" novalidate>

              <div class="form-group">
                <label for="signupName">Nama Lengkap</label>
                <input type="text" id="signupName" placeholder="Masukkan nama lengkap" required>
              </div>

              <div class="form-group">
                <label for="signupEmail">Email</label>
                <input type="email" id="signupEmail" placeholder="nama@email.com" required>
              </div>

              <div class="form-group">
                <label for="signupPassword">Kata Sandi</label>
                <input type="password" id="signupPassword" placeholder="Buat kata sandi" required>
              </div>

              <button type="submit" class="auth-submit-button">
                Daftar
              </button>

            </form>

            <p class="auth-switch">
              Sudah punya akun?
              <button type="button" class="auth-switch-button" data-target="login">
                Masuk di sini
              </button>
            </p>

          </div>

        </div>

      </div>

    </div>

       <div class="confetti-layer" id="confettiLayer"></div>

    <div
      class="modal fade"
      id="loginSuccessModal"
      tabindex="-1"
      aria-hidden="true"
      data-bs-backdrop="static"
    >

      <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content auth-success-modal">

          <div class="modal-body text-center p-4">

            <div class="auth-success-icon">
              🐾
            </div>

            <h5>Berhasil Masuk!</h5>

            <p class="auth-subtitle">
              Selamat datang kembali, yuk lanjut ke dashboard.
            </p>

            <button
              type="button"
              class="auth-submit-button"
              id="loginSuccessOkButton"
            >
              OK
            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="JS/login.js"></script>

</body>

</html>
